# Paquets de release — un INSTALLATEUR par plateforme, attaché à la balise.
#
# Ce que ce workflow promet, et ce qu'il ne promet pas
# ----------------------------------------------------
# IL PROMET, pour chacune des trois plateformes, le format que le système
# d'exploitation attend — et non plus une archive à déballer à la main :
#
#   macOS    Nineteen-<v>-macOS-universal.dmg   un Nineteen.app à glisser dans
#                                               Applications (arm64 + x86_64)
#   Linux    Nineteen-<v>-x86_64.AppImage       chmod +x, puis on lance
#            nineteen_<v>_amd64.deb             apt install ./…
#            nineteen-<v>-linux-x86_64.tar.gz   à déballer où l'on veut
#   Windows  Nineteen-<v>-windows-x64.exe       double-clic, SANS droits admin
#
# IL NE PROMET PAS la signature, ET LE CHEMIN NON SIGNÉ EST LE CHEMIN PRINCIPAL.
#
# Un `.dmg` que macOS ouvre sans rien dire demande un certificat **Developer ID
# Application** ET la notarisation ; un `.exe` que SmartScreen laisse passer
# demande un certificat Authenticode. Les trois s'achètent, et ce dépôt n'en a
# aucun. Un compte développeur Apple GRATUIT ne suffit pas : il ne délivre qu'une
# identité « Apple Development », et signer avec elle ne retire pas le refus —
# vérifié sur la machine de développement, `spctl -a -vv` répond « rejected »
# quand même.
#
# La règle est donc : SI les variables de signature sont dans l'environnement du
# job, on signe ; SINON on fabrique le paquet non signé, on le DIT, et rien
# n'échoue. Aucune étape de ce fichier ne dépend d'un secret pour réussir.
#
# Ce que voit un joueur qui télécharge un paquet non signé, et le geste exact
# qu'on lui demande, sont dans le paquet lui-même — `A-LIRE-AVANT-D-OUVRIR.txt`
# à la racine du .dmg — dans un manifeste `SIGNATURE-<plateforme>.txt` publié à
# côté, sur la page de téléchargement du site et dans les notes de version. Pas
# à un seul de ces endroits : un joueur n'en ouvre qu'un.
#
# CE QUI A ÉTÉ ESSAYÉ ET CE QUI NE L'A PAS ÉTÉ.
#   Le chemin NON SIGNÉ de macOS : essayé de bout en bout sur un Mac Apple
#   Silicon — .dmg fabriqué, monté, application recopiée, `com.apple.quarantine`
#   posé comme le pose Safari, lancement refusé (tué, code 137), geste appliqué,
#   lancement et rendu d'une image. Voir `packaging/macos/signature.cmake`.
#   Le chemin SIGNÉ, sur les trois plateformes : JAMAIS EXÉCUTÉ, faute de
#   certificat. Il est écrit d'après la documentation des outils. Le premier qui
#   posera un certificat doit s'attendre à le corriger.
#   Windows, signé ou non : rien n'en a été exécuté ailleurs qu'ici. La machine
#   de développement n'a ni makensis, ni mingw-w64, ni wine (vérifié).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Balise à empaqueter (vide = HEAD)"
        required: false

permissions:
  contents: write

jobs:
  # ==========================================================================
  # macOS — le .dmg
  # ==========================================================================
  macos:
    name: Paquet macOS (.dmg)
    runs-on: macos-14
    # Les secrets sont recopiés au niveau du JOB, et pas seulement dans l'étape
    # qui s'en sert. Un `if:` d'étape ne voit PAS les variables déclarées dans
    # le `env:` de cette même étape : la condition de l'ancienne version
    # (`env.MACOS_CERT_P12 != ''`) était donc toujours fausse, et l'étape de
    # signature n'aurait pas tourné même avec un certificat en place.
    #
    # Au niveau du JOB aussi parce que c'est `cpack` qui signe, pas une étape :
    # ces variables doivent être dans l'environnement de l'étape « Paquet ».
    # Un secret absent vaut la chaîne vide, jamais une erreur.
    env:
      NINETEEN_SIGN_APPLE_IDENTITY: ${{ secrets.NINETEEN_SIGN_APPLE_IDENTITY }}
      NINETEEN_SIGN_APPLE_P12: ${{ secrets.NINETEEN_SIGN_APPLE_P12 }}
      NINETEEN_SIGN_APPLE_P12_PASSWORD: ${{ secrets.NINETEEN_SIGN_APPLE_P12_PASSWORD }}
      NINETEEN_NOTARIZE_APPLE_ID: ${{ secrets.NINETEEN_NOTARIZE_APPLE_ID }}
      NINETEEN_NOTARIZE_TEAM_ID: ${{ secrets.NINETEEN_NOTARIZE_TEAM_ID }}
      NINETEEN_NOTARIZE_PASSWORD: ${{ secrets.NINETEEN_NOTARIZE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dépendances
        run: brew install ninja glslang

      - name: Configuration
        run: cmake --preset macos-universal -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build --preset macos-universal

      # Un paquet issu d'un arbre dont les tests échouent n'a rien à faire dans
      # une release.
      - name: Tests
        run: ctest --preset macos-universal

      # LE TROUSSEAU SEULEMENT. La signature elle-même est faite par `cpack`,
      # dans `packaging/macos/signature.cmake` : c'est le seul instant où
      # `Nineteen.app` est encore modifiable avant que `hdiutil` ne la scelle.
      # Cette étape-ci se contente de rendre l'identité disponible à `codesign`,
      # ce qu'un runner neuf ne peut pas deviner.
      #
      # Sans certificat elle ne tourne pas, et `cpack` signera AD HOC — ce qui
      # ne fait pas passer Gatekeeper mais permet au binaire arm64 de se
      # charger. La différence est expliquée là où l'ad hoc est appelé.
      - name: Trousseau de signature
        if: env.NINETEEN_SIGN_APPLE_P12 != ''
        run: |
          set -eu
          echo "$NINETEEN_SIGN_APPLE_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$NINETEEN_SIGN_APPLE_P12_PASSWORD" -T /usr/bin/codesign
          # Sans cette ligne, `codesign` déclenche une demande de mot de passe
          # graphique à laquelle personne ne répond sur un runner, et le job
          # reste bloqué jusqu'au délai de garde.
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/cert.p12
          security find-identity -v -p codesigning

      # `cpack` signe, notarise, agrafe et écrit le manifeste, ou ne fait que
      # l'ad hoc — selon ce que `env:` porte au niveau du job. Cette commande est
      # la MÊME que celle de la documentation : il n'y a pas un paquet « de CI »
      # et un paquet « local ».
      - name: Paquet
        run: cpack --config build/macos-universal/CPackConfig.cmake -B build/macos-universal/paquets

      # Le .dmg est monté et l'application relancée depuis le volume : c'est le
      # seul moyen de savoir que le bundle est complet. `--help` suffit à
      # prouver que le Mach-O démarre ; `--headless --screenshot` prouverait en
      # plus que les assets sont là, mais demande un GPU que le runner n'a pas
      # toujours — et un job de release ne doit pas échouer pour ça.
      #
      # `A-LIRE-AVANT-D-OUVRIR.txt` est vérifié comme le reste : c'est le seul
      # endroit où le joueur d'un paquet non signé lira le geste à faire, et un
      # .dmg qui le perdrait n'aurait l'air de rien.
      - name: Le .dmg s'ouvre et l'app démarre
        run: |
          set -eux
          hdiutil attach build/macos-universal/paquets/*.dmg \
            -mountpoint /tmp/dmg -readonly -nobrowse
          ls -la /tmp/dmg
          test -L /tmp/dmg/Applications
          test -f /tmp/dmg/A-LIRE-AVANT-D-OUVRIR.txt
          test -f /tmp/dmg/Nineteen.app/Contents/Info.plist
          test -d /tmp/dmg/Nineteen.app/Contents/Resources/assets/scene
          lipo -archs /tmp/dmg/Nineteen.app/Contents/MacOS/nineteen
          /tmp/dmg/Nineteen.app/Contents/MacOS/nineteen --help | head -2
          hdiutil detach /tmp/dmg

      # LA SORTIE BRUTE, et pas un verdict recalculé par ce fichier. `codesign`
      # et `spctl` sont les seuls à savoir ce que le système décidera ; les
      # recopier tels quels dans le résumé évite qu'un `if:` d'ici ne prétende
      # le contraire de ce que le Mac du joueur fera.
      #
      # `|| true` sur `spctl` : il rend un code non nul dès qu'il refuse, ce qui
      # est LE CAS ATTENDU tant qu'aucun certificat n'existe. Sans ça le job
      # échouerait précisément dans le cas nominal.
      #
      # `set -e` malgré le `|| true` : sans lui, un montage raté laisserait
      # passer l'étape et écrirait un résumé vide, c'est-à-dire un paquet dont
      # personne n'aurait vu ce que le système en dit.
      - name: Ce que le système dit de ce paquet
        run: |
          set -ex
          hdiutil attach build/macos-universal/paquets/*.dmg \
            -mountpoint /tmp/dmg -readonly -nobrowse
          codesign -dv --verbose=4 /tmp/dmg/Nineteen.app 2>&1 | tee /tmp/codesign.txt
          spctl -a -vv /tmp/dmg/Nineteen.app 2>&1 | tee /tmp/spctl.txt || true
          hdiutil detach /tmp/dmg
          {
            echo "### macOS"
            echo ""
            ls -la build/macos-universal/paquets/
            echo ""
            echo '```'
            cat build/macos-universal/paquets/SIGNATURE-macos.txt
            echo '```'
            echo ""
            echo "codesign -dv --verbose=4 :"
            echo '```'
            cat /tmp/codesign.txt
            echo '```'
            echo ""
            echo "spctl -a -vv :"
            echo '```'
            cat /tmp/spctl.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Le manifeste part AVEC le paquet. Séparé, il ne sert à rien : c'est lui
      # qui dit si ce .dmg-là est signé, et qui porte les sommes SHA-256 que la
      # page de téléchargement promet.
      - uses: actions/upload-artifact@v4
        with:
          name: nineteen-macos
          path: |
            build/macos-universal/paquets/*.dmg
            build/macos-universal/paquets/SIGNATURE-macos.txt

  # ==========================================================================
  # Linux — AppImage, .deb, .tar.gz, construits DANS un conteneur 22.04
  # ==========================================================================
  #
  # POURQUOI PAS DIRECTEMENT SUR LE RUNNER.
  #
  # Un binaire lié à la glibc ne tourne que sur une glibc au moins aussi
  # récente. Construit sur `ubuntu-24.04`, il exigerait `glibc >= 2.39` et
  # refuserait de démarrer sur Debian 12 ou Ubuntu 22.04 LTS — c'est-à-dire là
  # où sont la moitié des postes — avec un message que personne ne sait lire.
  # Le conteneur fixe cette version à 2.35 ; voir packaging/linux/Dockerfile.build.
  #
  # Et c'est EXACTEMENT la même image et le même script que ceux qui ont servi à
  # vérifier les paquets Linux à la main : ce que la CI produit ici a déjà été
  # installé et lancé ailleurs, ce qui n'est pas rien pour un job qu'on ne
  # regarde qu'une fois par balise.
  linux:
    name: Paquets Linux (AppImage, .deb, .tar.gz)
    runs-on: ubuntu-24.04
    # AUCUN NOYAU LINUX NE REFUSE UN BINAIRE NON SIGNÉ. Il n'y a donc pas de
    # « chemin non signé qui ne marche pas » à réparer ici, contrairement à
    # macOS et Windows : ces trois paquets s'installent et démarrent tels quels.
    # La signature détachée ci-dessous sert à VÉRIFIER une provenance, pas à
    # obtenir une permission — `paquets.sh` dit ce qu'elle vaut et ce qu'elle ne
    # vaut pas.
    env:
      NINETEEN_SIGN_GPG_KEY: ${{ secrets.NINETEEN_SIGN_GPG_KEY }}
      NINETEEN_SIGN_GPG_PASSPHRASE: ${{ secrets.NINETEEN_SIGN_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Image de construction (Ubuntu 22.04, glibc 2.35)
        run: docker build -f packaging/linux/Dockerfile.build -t nineteen-build:22.04 packaging/linux

      # NINETEEN_TESTS=1 : la suite complète tourne DANS le conteneur, sur la
      # même vieille glibc que le paquet. C'est là qu'un défaut de portabilité se
      # voit — il s'en est trouvé un en écrivant ce workflow, voir
      # cmake/CompilerWarnings.cmake.
      #
      # Les deux variables de signature sont passées TOUJOURS, même vides : un
      # `-e VAR` sur une variable vide donne une chaîne vide dans le conteneur,
      # ce que `paquets.sh` traite comme « pas de clé ». Les passer sous
      # condition demanderait un `if:` sur chaque, pour le même résultat et une
      # ligne de plus à oublier.
      - name: Compilation, tests et paquets
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            -e NINETEEN_TESTS=1 \
            -e NINETEEN_SIGN_GPG_KEY \
            -e NINETEEN_SIGN_GPG_PASSPHRASE \
            nineteen-build:22.04 sh packaging/linux/paquets.sh

      # L'AppImage est relancée depuis le paquet fini, hors du conteneur qui
      # l'a produite : sur le runner 24.04, donc sur une AUTRE glibc que celle
      # de construction. C'est précisément la compatibilité qu'on cherche à
      # prouver. `--appimage-extract-and-run` parce qu'un runner GitHub n'a pas
      # FUSE — le joueur, lui, l'a.
      - name: L'AppImage démarre sur une autre distribution
        run: |
          set -eux
          chmod +x build/linux-x64/paquets/*.AppImage
          ./build/linux-x64/paquets/Nineteen-*.AppImage \
            --appimage-extract-and-run --help | head -2

      # `apt install ./…deb` et non `dpkg -i` : c'est la commande que reçoit le
      # joueur, et c'est la seule des deux qui résout les dépendances. Un .deb
      # dont les Depends sont fausses échoue ICI plutôt que chez lui.
      - name: Le .deb s'installe et le jeu se lance
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y ./build/linux-x64/paquets/nineteen_*.deb
          dpkg -L nineteen | head -20
          nineteen --help | head -2
          test -f /usr/share/applications/nineteen.desktop
          sudo apt-get remove -y nineteen

      # Le manifeste est recopié tel quel plutôt que résumé : c'est `paquets.sh`
      # qui sait ce qu'il a fait, et le réécrire ici serait la deuxième version
      # d'une même phrase, donc la première à devenir fausse.
      - name: Ce que contient ce paquet
        run: |
          {
            echo "### Linux"
            echo ""
            ls -la build/linux-x64/paquets/
            echo ""
            echo "Dépendances déclarées par le .deb :"
            dpkg-deb -f build/linux-x64/paquets/nineteen_*.deb Depends Recommends
            echo ""
            echo '```'
            cat build/linux-x64/paquets/SIGNATURE-linux.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # `*.asc` et la clé publique ne sont produits que sur le chemin signé.
      # `upload-artifact` accepte un motif qui ne trouve rien tant qu'AU MOINS
      # un autre en trouve : c'est le cas des trois paquets, donc l'absence de
      # signature ne fait pas échouer l'envoi.
      - uses: actions/upload-artifact@v4
        with:
          name: nineteen-linux
          path: |
            build/linux-x64/paquets/*.AppImage
            build/linux-x64/paquets/*.deb
            build/linux-x64/paquets/*.tar.gz
            build/linux-x64/paquets/*.asc
            build/linux-x64/paquets/SIGNATURE-linux.txt

  # ==========================================================================
  # Windows — l'installateur NSIS
  # ==========================================================================
  #
  # LE SEUL DES TROIS QUI N'AIT JAMAIS ÉTÉ ESSAYÉ AILLEURS QU'ICI. La machine de
  # développement est un Mac sans makensis, sans mingw-w64 et sans wine : le
  # `.exe` ne peut pas y être produit, et `cpack -G NSIS` s'y arrête avant même
  # de lire la configuration (« Cannot find NSIS compiler makensis »). Ce qui a
  # été vérifié depuis le Mac, c'est la CONFIGURATION, par le test `paquets`
  # (packaging/verifier.cmake) : variables posées, icône qui a bien l'en-tête
  # d'un .ico, licence sans un octet hors ASCII. Le reste se joue ici.
  #
  # `makensis` est préinstallé sur l'image `windows-2022` (NSIS 3.10, annoncé
  # dans actions/runner-images, images/windows/Windows2022-Readme.md). Rien
  # n'est donc à installer — mais si l'image change un jour, c'est le message
  # « Cannot find NSIS compiler » qu'il faudra reconnaître.
  windows:
    name: Paquet Windows (.exe)
    runs-on: windows-2022
    env:
      NINETEEN_SIGN_WINDOWS_PFX: ${{ secrets.NINETEEN_SIGN_WINDOWS_PFX }}
      NINETEEN_SIGN_WINDOWS_PASSWORD: ${{ secrets.NINETEEN_SIGN_WINDOWS_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Dépendances
        run: choco install --no-progress vulkan-sdk
        shell: pwsh

      - name: Configuration
        run: cmake --preset windows-x64 -DCMAKE_BUILD_TYPE=Release

      - name: Compilation
        run: cmake --build --preset windows-x64

      - name: Tests
        run: ctest --preset windows-x64

      # `signtool` N'EST PAS DANS LE PATH d'un runner windows-2022. Il est livré
      # avec le SDK Windows, sous `Program Files (x86)\Windows Kits\10\bin\
      # <version>\x64\`, et la version change avec l'image. L'ancienne rédaction
      # appelait `signtool` nu : elle aurait rendu « The term 'signtool' is not
      # recognized » au premier certificat posé. On le CHERCHE, et on s'arrête
      # en le disant s'il manque — mais seulement sur le chemin signé, celui que
      # quelqu'un a explicitement demandé en posant un secret.
      #
      # RIEN DE CE BLOC N'A ÉTÉ EXÉCUTÉ. La machine de développement est un Mac
      # sans makensis, sans mingw-w64 et sans wine (vérifié : les trois sont
      # absents). Le tri de `Sort-Object -Descending` prend la version de SDK la
      # plus récente, ce qui est la convention, pas une mesure.
      - name: Signature du binaire
        if: env.NINETEEN_SIGN_WINDOWS_PFX != ''
        shell: pwsh
        run: |
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
          $st = Get-ChildItem -Path $kit -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' } |
                Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $st) { throw "signtool.exe introuvable sous $kit" }
          "SIGNTOOL=$($st.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          [IO.File]::WriteAllBytes("$env:TEMP\cert.pfx",
            [Convert]::FromBase64String($env:NINETEEN_SIGN_WINDOWS_PFX))
          & $st.FullName sign /f "$env:TEMP\cert.pfx" /p "$env:NINETEEN_SIGN_WINDOWS_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "build/windows-x64/bin/nineteen.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool a echoue sur le binaire" }

      - name: Installateur
        run: cpack --config build/windows-x64/CPackConfig.cmake -B build/windows-x64/paquets

      # L'installateur lui-même se signe APRÈS avoir été construit : c'est lui
      # que SmartScreen inspecte, pas le jeu qu'il contient. Signer l'un sans
      # l'autre ne sert à rien.
      - name: Signature de l'installateur
        if: env.NINETEEN_SIGN_WINDOWS_PFX != ''
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /f "$env:TEMP\cert.pfx" /p "$env:NINETEEN_SIGN_WINDOWS_PASSWORD" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            (Get-Item build/windows-x64/paquets/*.exe).FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool a echoue sur l installateur" }
          Remove-Item "$env:TEMP\cert.pfx"

      # `/S` installe sans interface. On vérifie ensuite que le jeu est là où
      # l'installateur a promis de le mettre — dans le domaine de l'utilisateur,
      # sans droits administrateur — et qu'il démarre. Un installateur qui
      # produit un répertoire vide passerait sans ça.
      - name: L'installateur s'exécute sans droits admin
        shell: pwsh
        run: |
          $exe = (Get-Item build/windows-x64/paquets/*.exe).FullName
          Start-Process -FilePath $exe -ArgumentList "/S" -Wait
          $jeu = "$env:LOCALAPPDATA\Programs\nineteen\bin\nineteen.exe"
          if (-not (Test-Path $jeu)) { throw "installe ailleurs que prevu : $jeu" }
          & $jeu --help | Select-Object -First 2
          Get-ChildItem "$env:LOCALAPPDATA\Programs\nineteen"

      # LE MANIFESTE EST ÉCRIT PAR WINDOWS, sur Windows. Il n'y a pas ici de
      # `signature.cmake` comme sur macOS parce qu'il n'y a rien à faire au
      # moment de l'empaquetage : NSIS produit un `.exe` qu'on signe APRÈS,
      # tandis qu'un `.dmg` scelle son bundle et ne se rouvre pas.
      #
      # `Get-AuthenticodeSignature` plutôt qu'un `if` sur le secret : c'est
      # Windows qui dit si ce fichier-là est signé, et sa réponse ne peut pas
      # diverger de ce que verra le poste du joueur. Un test sur la présence
      # d'un secret le pourrait — il dirait « signé » si `signtool` avait
      # silencieusement échoué.
      #
      # PAS DE `@"…"@` : un « here-string » PowerShell exige que son `"@` de
      # fermeture soit en colonne 1, ce qu'un bloc `run: |` de YAML ne permet
      # pas — le fichier cesse d'être du YAML valide. Un tableau de lignes fait
      # la même chose et reste indentable.
      - name: Ce que contient ce paquet
        shell: pwsh
        run: |
          $exe = (Get-Item build/windows-x64/paquets/*.exe)
          $sig = Get-AuthenticodeSignature $exe.FullName
          $somme = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($sig.Status -eq "Valid") {
            $etat = "SIGNE -- " + $sig.SignerCertificate.Subject
            $geste = @("  Rien a faire : double-clic.")
          } else {
            $etat = "NON SIGNE (Authenticode : " + $sig.Status + ")"
            $geste = @(
              "  Windows affiche l'ecran bleu SmartScreen (« Windows a protege votre",
              "  ordinateur »). Cliquer sur « Informations complementaires », puis sur",
              "  « Executer quand meme ». Le bouton n'apparait qu'APRES le premier clic :",
              "  c'est la marche normale, pas un refus definitif."
            )
          }
          $manifeste = "build/windows-x64/paquets/SIGNATURE-windows.txt"
          $lignes = @(
            "Nineteen -- installateur Windows",
            "",
            "Etat : $etat",
            "",
            $exe.Name,
            "  sha256 = $somme",
            "",
            "Ce que le joueur doit faire :"
          ) + $geste + @(
            "",
            "Verifier soi-meme :",
            "  Get-FileHash " + $exe.Name + " -Algorithm SHA256",
            "  Get-AuthenticodeSignature " + $exe.Name
          )
          $lignes | Set-Content -Encoding utf8 $manifeste
          @("### Windows", "", '```') + $lignes + @('```') |
            Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: nineteen-windows
          path: |
            build/windows-x64/paquets/*.exe
            build/windows-x64/paquets/SIGNATURE-windows.txt

  # ==========================================================================
  # La release
  # ==========================================================================
  publier:
    name: Attacher à la release
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquets
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: paquets/*
          body: |
            ## Nineteen ${{ github.ref_name }}

            ### À lire d'abord : ces paquets ne sont pas signés

            Le certificat qui évite l'avertissement s'achète — **Developer ID
            Application** chez Apple, Authenticode chez Windows — et ce projet
            n'en a pas encore. Les paquets fonctionnent, mais le système
            demandera un geste de plus **la première fois**.

            **macOS** affiche :

            > Apple could not verify "Nineteen" is free of malware that may harm
            > your Mac or compromise your privacy.

            Après avoir glissé Nineteen dans Applications, ouvrir le Terminal
            (Applications → Utilitaires) et coller cette ligne, une seule fois :

            ```
            xattr -dr com.apple.quarantine /Applications/Nineteen.app
            ```

            Elle retire l'étiquette « téléchargé depuis Internet » posée par le
            navigateur ; elle ne désactive aucune protection du système. Le même
            texte est dans le `.dmg`, dans `A-LIRE-AVANT-D-OUVRIR.txt`.

            **Windows** affiche l'écran bleu SmartScreen (« Windows a protégé
            votre ordinateur ») : cliquer sur **Informations complémentaires**,
            puis sur **Exécuter quand même**. Le bouton n'apparaît qu'après le
            premier clic.

            **Linux** ne demande rien : aucun noyau Linux ne refuse un binaire
            non signé.

            Les fichiers `SIGNATURE-*.txt` publiés ci-dessous disent, pour
            chaque plateforme, si ce paquet-là est signé, et portent les sommes
            SHA-256.

            ### Installer

            | Système | Fichier | Ce qu'on en fait |
            |---|---|---|
            | macOS 11+ | `Nineteen-*-macOS-universal.dmg` | Ouvrir, glisser **Nineteen** sur **Applications**, puis la ligne ci-dessus. Universel : Apple Silicon et Intel. |
            | Linux | `Nineteen-*-x86_64.AppImage` | `chmod +x Nineteen-*.AppImage` puis lancer. Rien à installer. |
            | Debian / Ubuntu | `nineteen_*_amd64.deb` | `sudo apt install ./nineteen_*_amd64.deb` — le jeu apparaît dans le menu. |
            | Linux, sans installer | `nineteen-*-linux-x86_64.tar.gz` | Déballer, lancer `bin/nineteen`. |
            | Windows 10/11 | `Nineteen-*-windows-x64.exe` | Double-clic, puis SmartScreen ci-dessus. **Aucun droit administrateur** : le jeu s'installe dans votre propre profil, avec un raccourci au menu Démarrer et un désinstalleur. |

            Les paquets Linux portent **l'architecture de la machine qui les a
            produits**, lue et non supposée. Ceux-ci sortent d'un runner GitHub
            `ubuntu-24.04`, donc `x86_64` / `amd64` : ils ne s'installent pas
            sur un Raspberry Pi ni sur une machine ARM.

            L'AppImage et le `.deb` sont construits sur **Ubuntu 22.04 (glibc
            2.35)** : ils démarrent donc aussi sur Debian 12, Mint 21 et tout ce
            qui est sorti depuis. Une construction sur une base plus récente
            aurait exclu ces systèmes sans le dire.

            ### Prérequis réels

            Un GPU **Vulkan** (Linux, Windows) ou **Metal** (macOS). Une machine
            Windows sans pilote Vulkan ne lancera pas le jeu : le binaire ne
            contient pas de DXIL, donc SDL n'y choisira pas Direct3D 12. Voir
            `docs/JOUER.md`.

            Le jeu n'ouvre aucune connexion tant qu'aucun serveur n'est
            configuré, et n'a besoin d'aucun compte.
